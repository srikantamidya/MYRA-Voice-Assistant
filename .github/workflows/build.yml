name: Build MYRA APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: MYRA-Voice-Assistant

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon
        working-directory: MYRA-Voice-Assistant

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-App
          path: MYRA-Voice-Assistant/app/build/outputs/apk/debug/app-debug.apk
